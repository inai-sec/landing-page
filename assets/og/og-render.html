<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>InaiSec social card</title>
  <style>
    @font-face {
      font-family: "Manrope";
      font-style: normal;
      font-weight: 200 800;
      src: url("../fonts/manrope-200-800-latin.woff2") format("woff2");
    }

    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 500;
      src: url("../fonts/ibmplexmono-500-latin.woff2") format("woff2");
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: #071019;
    }

    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      padding: 54px 66px 48px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #071019;
      color: #f1f4f6;
      font-family: "Manrope", system-ui, sans-serif;
    }

    .ambient {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 58%;
      opacity: 0.08;
    }

    .top,
    .body,
    .foot {
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 188px;
      height: auto;
    }

    .body {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(410px, 0.92fr);
      align-items: center;
      gap: 42px;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: #58def6;
      font-family: "IBM Plex Mono", monospace;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .headline {
      max-width: 650px;
      margin: 0;
      font-size: 61px;
      font-weight: 480;
      letter-spacing: -0.045em;
      line-height: 1.01;
    }

    .headline span {
      display: block;
    }

    .headline .point {
      color: #a9b4bd;
    }

    .sub {
      max-width: 610px;
      margin: 25px 0 0;
      color: #a4b0b9;
      font-size: 20px;
      line-height: 1.45;
    }

    .visual {
      width: 100%;
      height: auto;
      mix-blend-mode: screen;
    }

    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 18px;
      border-top: 1px solid rgba(190, 208, 220, 0.2);
      color: #74838f;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
    }

    .signal {
      width: 64px;
      height: 2px;
      background: #2bd2f3;
    }
  </style>
</head>
<body>
  <main class="card" aria-label="InaiSec social preview">
    <img class="ambient" src="../visuals/ambient-grid.webp" alt="">
    <header class="top">
      <img class="logo" src="../logo/inaisec-lockup-dark.svg" alt="InaiSec">
    </header>

    <section class="body">
      <div>
        <p class="eyebrow">For the part after detection</p>
        <h1 class="headline">
          <span>The alert is clear.</span>
          <span class="point">The business answer isn&rsquo;t.</span>
        </h1>
        <p class="sub">Bring one hard incident. Compare notes with the founder. No production access.</p>
      </div>
      <img class="visual" src="../visuals/handoff-convergence.webp" alt="Four response handoffs converging into a shared decision">
    </section>

    <footer class="foot">
      <div class="signal" aria-hidden="true"></div>
      <span>inaisec.ai</span>
    </footer>
  </main>
</body>
</html>
