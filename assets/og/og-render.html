<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0e1118; }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 85% 10%, rgba(61, 202, 230, 0.18), transparent 55%),
        radial-gradient(circle at 10% 95%, rgba(148, 144, 240, 0.14), transparent 55%),
        #0e1118;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #f0ece6;
      padding: 70px 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
    }
    .top, .body, .foot { position: relative; z-index: 1; }
    .logo { display: flex; align-items: center; }
    .eyebrow {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #a8a299;
      text-transform: uppercase;
      margin: 0 0 22px;
    }
    .headline {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.0;
      margin: 0 0 28px;
      max-width: 1000px;
      background-image: linear-gradient(120deg, #f0ece6 0%, #f0ece6 55%, #3dcae6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      font-size: 28px;
      font-weight: 500;
      color: #c8c3b9;
      line-height: 1.35;
      max-width: 920px;
      margin: 0;
    }
    .accent {
      width: 48px;
      height: 4px;
      border-radius: 2px;
      background: #3dcae6;
      box-shadow: 0 0 16px rgba(61, 202, 230, 0.7);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="22 0 220 74" width="240" height="80" role="img" aria-label="InaiSec">
          <defs>
            <radialGradient id="il-glow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#3dcae6" stop-opacity="0.65"/>
              <stop offset="1" stop-color="#3dcae6" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <ellipse cx="50" cy="20" rx="22" ry="16" fill="url(#il-glow)"/>
          <rect x="34" y="32" width="12" height="38" rx="6" fill="#f0ece6"/>
          <rect x="24" y="66" width="32" height="4" rx="2" fill="#f0ece6" fill-opacity="0.7"/>
          <circle cx="44" cy="20" r="8" fill="#3dcae6"/>
          <circle cx="42" cy="17" r="2.5" fill="#ffffff" fill-opacity="0.8"/>
          <text x="58" y="70" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="52" letter-spacing="-2.34" fill="#f0ece6">naiSec</text>
        </svg>
      </div>
    </div>
    <div class="body">
      <p class="eyebrow">Identity-first incident response</p>
      <h1 class="headline">From incident to who to notify.</h1>
      <p class="sub">The identity-first IR layer for everything after an alert is confirmed: evidence, identity tracing, blast radius, and notification readiness.</p>
    </div>
    <div class="foot">
      <div class="accent"></div>
    </div>
  </div>
</body>
</html>
