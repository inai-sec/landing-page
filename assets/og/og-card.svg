<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="InaiSec - Identity-first incident response">
  <defs>
    <radialGradient id="bg-glow-tr" cx="0.85" cy="0.10" r="0.55">
      <stop offset="0" stop-color="#3dcae6" stop-opacity="0.18"></stop>
      <stop offset="1" stop-color="#3dcae6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="bg-glow-bl" cx="0.10" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#9490f0" stop-opacity="0.14"></stop>
      <stop offset="1" stop-color="#9490f0" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="il-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3dcae6" stop-opacity="0.65"></stop>
      <stop offset="1" stop-color="#3dcae6" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#f0ece6"></stop>
      <stop offset="0.6" stop-color="#f0ece6"></stop>
      <stop offset="1" stop-color="#3dcae6"></stop>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0e1118"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#bg-glow-tr)"/>
  <rect width="1200" height="630" fill="url(#bg-glow-bl)"/>

  <!-- Logo lockup (scaled and positioned top-left) -->
  <g transform="translate(80, 70)">
    <ellipse cx="50" cy="20" rx="22" ry="16" fill="url(#il-glow)"></ellipse>
    <rect x="34" y="32" width="12" height="38" rx="6" fill="#f0ece6"></rect>
    <rect x="24" y="66" width="32" height="4" rx="2" fill="#f0ece6" fill-opacity="0.7"></rect>
    <circle cx="44" cy="20" r="8" fill="#3dcae6"></circle>
    <circle cx="42" cy="17" r="2.5" fill="#ffffff" fill-opacity="0.8"></circle>
    <text x="58" y="70" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="52" letter-spacing="-2.34" fill="#f0ece6">naiSec</text>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="280" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="20" font-weight="700" letter-spacing="2.4" fill="#a8a299" text-transform="uppercase">IDENTITY-FIRST INCIDENT RESPONSE</text>

  <!-- Main headline -->
  <text x="80" y="370" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="72" letter-spacing="-3.6" fill="url(#title-grad)">From security incident to</text>
  <text x="80" y="450" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="72" letter-spacing="-3.6" fill="url(#title-grad)">disclosure-ready in minutes.</text>

  <!-- Sub copy -->
  <text x="80" y="520" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="26" fill="#c8c3b9">The identity-first IR layer that bridges</text>
  <text x="80" y="555" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="26" fill="#c8c3b9">threat detection to disclosure.</text>

  <!-- Footer accent line -->
  <rect x="80" y="595" width="40" height="3" rx="1.5" fill="#3dcae6"/>
</svg>
