<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InaiSec landing page — visual QA comparison</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #090d14; color: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; }
    h1 { margin: 0 0 24px; font-size: 24px; }
    section { margin: 0 0 36px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    figure { margin: 0; padding: 12px; border: 1px solid #263244; border-radius: 12px; background: #0e1520; }
    figcaption { margin: 0 0 10px; color: #8eeeff; font: 600 12px/1.4 ui-monospace, monospace; text-transform: uppercase; letter-spacing: .08em; }
    img { display: block; width: 100%; height: auto; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>InaiSec landing page — before / after visual QA</h1>
  <section>
    <h2>Problem positioning and copy</h2>
    <div class="pair">
      <figure><figcaption>Before</figcaption><img src="../content-review-2026-07-15/01-local-problem.jpg" alt="Problem section before"></figure>
      <figure><figcaption>After</figcaption><img src="08-after-problem-final.jpg" alt="Problem section after"></figure>
    </div>
  </section>
  <section>
    <h2>Header navigation spacing</h2>
    <div class="pair">
      <figure><figcaption>Before</figcaption><img src="01-before-header.jpg" alt="Header before"></figure>
      <figure><figcaption>After</figcaption><img src="04-after-header.jpg" alt="Header after"></figure>
    </div>
  </section>
  <section>
    <h2>Why now card proportions</h2>
    <div class="pair">
      <figure><figcaption>Before</figcaption><img src="02-before-why-now.jpg" alt="Why now before"></figure>
      <figure><figcaption>After</figcaption><img src="03-after-why-now.jpg" alt="Why now after"></figure>
    </div>
  </section>
  <section>
    <h2>FAQ content</h2>
    <div class="pair">
      <figure><figcaption>Before</figcaption><img src="../content-review-2026-07-15/02-local-faq.jpg" alt="FAQ before"></figure>
      <figure><figcaption>After</figcaption><img src="07-after-faq.jpg" alt="FAQ after"></figure>
    </div>
  </section>
</body>
</html>
