<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InaiSec focused Problem typography comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px;
      background: #090b10;
      color: #e2e4e8;
      font: 15px/1.5 system-ui, sans-serif;
    }
    h1 { margin: 0 0 24px; font-size: 26px; }
    figure {
      margin: 0 0 28px;
      padding: 12px;
      border: 1px solid #2a303b;
      background: #11151d;
    }
    figcaption {
      margin-bottom: 10px;
      color: #9da7b6;
      font-weight: 700;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Problem section typography — same viewport and state</h1>
  <figure>
    <figcaption>Before</figcaption>
    <img src="06-before-problem-desktop-dark.png" alt="Problem section before the typography pass">
  </figure>
  <figure>
    <figcaption>After</figcaption>
    <img src="13-after-problem-desktop-dark.png" alt="Problem section after the typography pass">
  </figure>
</body>
</html>
