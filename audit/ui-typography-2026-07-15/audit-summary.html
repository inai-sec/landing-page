<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InaiSec final UI audit</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px;
      background: #090b10;
      color: #e2e4e8;
      font: 15px/1.5 system-ui, sans-serif;
    }
    h1 { margin: 0 0 24px; font-size: 26px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    figure {
      margin: 0;
      padding: 12px;
      border: 1px solid #2a303b;
      background: #11151d;
    }
    figure:last-child { grid-column: 1 / -1; }
    figcaption {
      margin-bottom: 10px;
      color: #9da7b6;
      font-weight: 700;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>InaiSec final UI audit — dark desktop flow</h1>
  <div class="grid">
    <figure><figcaption>1. Hero</figcaption><img src="12-after-hero-desktop-dark.png" alt="Final hero section"></figure>
    <figure><figcaption>2. Problem</figcaption><img src="13-after-problem-desktop-dark.png" alt="Final Problem section"></figure>
    <figure><figcaption>3. Outcomes</figcaption><img src="14-after-outcomes-desktop-dark.png" alt="Final Outcomes section"></figure>
    <figure><figcaption>4. Why now</figcaption><img src="15-after-why-now-desktop-dark.png" alt="Final Why now section"></figure>
    <figure><figcaption>5. Founder</figcaption><img src="16-after-founder-desktop-dark.png" alt="Final Founder section"></figure>
    <figure><figcaption>6. Design partner</figcaption><img src="17-after-join-desktop-dark.png" alt="Final Design partner section"></figure>
    <figure><figcaption>7. FAQ</figcaption><img src="18-after-faq-desktop-dark.png" alt="Final FAQ section"></figure>
  </div>
</body>
</html>
