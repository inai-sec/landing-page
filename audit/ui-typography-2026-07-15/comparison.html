<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InaiSec typography audit comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #090b10; color: #e2e4e8; font: 15px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 24px; font-size: 26px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    section { margin-bottom: 34px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    figure { margin: 0; padding: 12px; border: 1px solid #2a303b; background: #11151d; }
    figcaption { margin-bottom: 10px; color: #9da7b6; font-weight: 700; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>InaiSec UI typography audit — same-state before/after</h1>

  <section>
    <h2>Problem</h2>
    <div class="pair">
      <figure><figcaption>Before</figcaption><img src="06-before-problem-desktop-dark.png" alt="Problem section before"></figure>
      <figure><figcaption>After</figcaption><img src="13-after-problem-desktop-dark.png" alt="Problem section after"></figure>
    </div>
  </section>

  <section>
    <h2>Outcomes</h2>
    <div class="pair">
      <figure><figcaption>Before</figcaption><img src="07-before-outcomes-desktop-dark.png" alt="Outcomes section before"></figure>
      <figure><figcaption>After</figcaption><img src="14-after-outcomes-desktop-dark.png" alt="Outcomes section after"></figure>
    </div>
  </section>

  <section>
    <h2>Why now</h2>
    <div class="pair">
      <figure><figcaption>Before</figcaption><img src="08-before-why-now-desktop-dark.png" alt="Why now section before"></figure>
      <figure><figcaption>After</figcaption><img src="15-after-why-now-desktop-dark.png" alt="Why now section after"></figure>
    </div>
  </section>

  <section>
    <h2>Design partner form</h2>
    <div class="pair">
      <figure><figcaption>Before</figcaption><img src="10-before-join-desktop-dark.png" alt="Design partner section before"></figure>
      <figure><figcaption>After</figcaption><img src="17-after-join-desktop-dark.png" alt="Design partner section after"></figure>
    </div>
  </section>
</body>
</html>
