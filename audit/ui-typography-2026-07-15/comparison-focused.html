<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InaiSec focused typography comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px;
      background: #090b10;
      color: #e2e4e8;
      font: 15px/1.5 system-ui, sans-serif;
    }
    h1 { margin: 0 0 24px; font-size: 26px; }
    .pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    figure {
      margin: 0;
      padding: 12px;
      border: 1px solid #2a303b;
      background: #11151d;
    }
    figcaption {
      margin-bottom: 10px;
      color: #9da7b6;
      font-weight: 700;
    }
    .crop {
      position: relative;
      height: 350px;
      overflow: hidden;
      background: #0e1118;
    }
    .crop img {
      position: absolute;
      top: -540px;
      left: -78px;
      display: block;
      width: 1440px;
      max-width: none;
      height: 1000px;
    }
  </style>
</head>
<body>
  <h1>Problem item typography — same viewport and region</h1>
  <div class="pair">
    <figure>
      <figcaption>Before</figcaption>
      <div class="crop"><img src="06-before-problem-desktop-dark.png" alt="Problem item hierarchy before"></div>
    </figure>
    <figure>
      <figcaption>After</figcaption>
      <div class="crop"><img src="13-after-problem-desktop-dark.png" alt="Problem item hierarchy after"></div>
    </figure>
  </div>
</body>
</html>
