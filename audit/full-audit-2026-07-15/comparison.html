<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InaiSec audit comparison</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #080b10; color: #f4f7fb; }
    header { max-width: 1400px; margin: 0 auto 28px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0; color: #aab3c0; }
    main { display: grid; gap: 32px; max-width: 1400px; margin: 0 auto; }
    section { padding: 18px; border: 1px solid #27303c; border-radius: 16px; background: #11161e; }
    h2 { margin: 0 0 14px; font-size: 18px; }
    .pair { display: flex; align-items: flex-start; gap: 16px; }
    figure { flex: 0 0 calc(50% - 8px); width: calc(50% - 8px); min-width: 0; margin: 0; }
    figcaption { margin-bottom: 8px; color: #78dff3; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    img { display: block; width: 100%; max-width: 100%; height: auto; border: 1px solid #27303c; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>InaiSec landing-page audit: before and after</h1>
    <p>Same 1440 × 1000 viewport, dark theme, corresponding anchored sections.</p>
  </header>
  <main>
    <section>
      <h2>Problem narrative</h2>
      <div class="pair">
        <figure><figcaption>Before</figcaption><img src="02-problem-dark.jpg" alt="Problem section before revision"></figure>
        <figure><figcaption>After</figcaption><img src="16-after-problem-dark.jpg" alt="Problem section after revision"></figure>
      </div>
    </section>
    <section>
      <h2>Outcomes and convergence illustration</h2>
      <div class="pair">
        <figure><figcaption>Before</figcaption><img src="03-outcomes-dark.jpg" alt="Outcomes section before revision"></figure>
        <figure><figcaption>After</figcaption><img src="17-after-outcomes-dark.jpg" alt="Outcomes section after revision"></figure>
      </div>
    </section>
    <section>
      <h2>Why now</h2>
      <div class="pair">
        <figure><figcaption>Before</figcaption><img src="04-why-now-dark.jpg" alt="Why now section before revision"></figure>
        <figure><figcaption>After</figcaption><img src="18-after-why-now-dark.jpg" alt="Why now section after revision"></figure>
      </div>
    </section>
    <section>
      <h2>FAQ</h2>
      <div class="pair">
        <figure><figcaption>Before</figcaption><img src="07-faq-dark.jpg" alt="FAQ section before revision"></figure>
        <figure><figcaption>After</figcaption><img src="20-after-faq-dark.jpg" alt="FAQ section after revision"></figure>
      </div>
    </section>
  </main>
</body>
</html>
